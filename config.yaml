provider: "openai"

openai:
  model: "gpt-4o-mini"
  
anthropic:
  model: "claude-haiku-4-5"

generation:
  temperature: 0.2
  max_output_tokens: 4096

safety:
  max_tool_turns: 4
  max_inline_items: 10
  max_tool_result_chars: 2000
  context_history_limit: 20
  llm_min_interval_seconds: 0.75
  rate_limit_max_retries: 6
  rate_limit_initial_delay_seconds: 1.0
  rate_limit_max_delay_seconds: 30.0
  rate_limit_jitter_seconds: 0.25

developer:
  mode: true
  log_dir: null   # defaults to <project_root>/logs
